name: bq-viewer

# =============================================================================
# BQ Viewer — Coolify / Docker Compose (Production)
# =============================================================================
# Gunakan file ini untuk deployment di Coolify.
# File ini menggunakan pre-built images dari Docker Hub — pastikan image
# sudah ter-push via GitHub Actions sebelum deploy.
#
# Cara pakai di Coolify:
#   1. New Resource → Docker Compose
#   2. Pilih repo maulananizhar/fe-bq-viewer
#   3. Build Pack: docker-compose
#   4. Compose File: docker-compose.coolify.yml
#   5. Set environment variables (DOCKER_USERNAME, MONGODB_URI, dll)
#   6. Deploy!
# =============================================================================

services:
  backend:
    image: ${DOCKER_USERNAME}/be-bq-viewer:latest
    container_name: be-bq-viewer
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
    restart: unless-stopped
    networks:
      - bq-viewer-network

  frontend:
    image: ${DOCKER_USERNAME}/fe-bq-viewer:latest
    container_name: fe-bq-viewer
    ports:
      - "${NGINX_PORT:-80}:80"
    environment:
      - NGINX_PORT=80
      - BACKEND_HOST=backend
      - BACKEND_PORT=5000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - bq-viewer-network

networks:
  bq-viewer-network:
    driver: bridge
