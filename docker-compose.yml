name: bq-viewer

# =============================================================================
# BQ Viewer — Coolify / Docker Compose
# =============================================================================
# Catatan: file ini untuk deployment dengan Coolify atau langsung via
# docker compose. MongoDB TIDAK disertakan — Anda harus memiliki
# server MongoDB sendiri.
# =============================================================================

services:
  backend:
    build:
      context: ../be-bq-viewer
      dockerfile: Dockerfile
    container_name: be-bq-viewer
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
    restart: unless-stopped
    networks:
      - bq-viewer-network

  frontend:
    build:
      context: ../fe-bq-viewer
      dockerfile: Dockerfile
    container_name: fe-bq-viewer
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - PORT=80
      - BACKEND_HOST=backend
      - BACKEND_PORT=5000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - bq-viewer-network

networks:
  bq-viewer-network:
    driver: bridge
