name: bq-viewer

services:
  backend:
    build:
      context: ../be-bq-viewer
      dockerfile: Dockerfile
    container_name: be-bq-viewer
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://root:password@mongo:27017/bq_viewer_db?directConnection=true
    env_file:
      - ../be-bq-viewer/.env
    depends_on:
      mongo:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ../fe-bq-viewer
      dockerfile: Dockerfile
    container_name: fe-bq-viewer
    ports:
      - "${NGINX_PORT:-80}:80"
    environment:
      - NGINX_PORT=80
      - BACKEND_HOST=backend
      - BACKEND_PORT=5000
    depends_on:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: bq-viewer-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: bq_viewer_db
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
